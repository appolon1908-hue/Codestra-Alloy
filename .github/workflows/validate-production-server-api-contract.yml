name: Validate Codestra production server API contract

on:
  pull_request:
    paths:
      - docs/CODESTRA_PRODUCTION_SERVER_API_CONTRACT.md
      - codestra/deploy/compose.candidate.yaml
      - codestra/deploy/readonly_proxy.go
      - scripts/build_and_inspect_locked_image.sh
      - .github/workflows/validate-production-server-api-contract.yml
  push:
    branches: [development, test, staging, production, main]
    paths:
      - docs/CODESTRA_PRODUCTION_SERVER_API_CONTRACT.md
      - codestra/deploy/compose.candidate.yaml
      - codestra/deploy/readonly_proxy.go
      - scripts/build_and_inspect_locked_image.sh
      - .github/workflows/validate-production-server-api-contract.yml

permissions:
  contents: read

concurrency:
  group: alloy-production-api-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Validate source-only production contract
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('docs/CODESTRA_PRODUCTION_SERVER_API_CONTRACT.md').read_text(encoding='utf-8')
          required = [
              'appolon1908-hue/Codestra-Alloy', '37.27.128.39', '65.109.65.169',
              'SOURCE_CONTRACT_PREPARED_NOT_DEPLOYED', 'GET` | `:12346/-/healthy',
              'GET` | `:12346/-/ready',
              'GET` | `:12346/metrics', 'GET`, `POST` | `:12346/-/reload',
              'GET` | `:12346/-/support',
              'JOURNAL_CAPABLE_BUILD=PASS', 'DOCKER_SOCKET_MOUNTED=NO',
              'NATIVE_HTTP_ROUTE_INVENTORY=PASS',
              'HTTP_RELOAD_FROM_NETWORK_PEER=DENIED',
              'SUPPORT_BUNDLE_FROM_NETWORK_PEER=DENIED',
              'GET_OR_POST_/-/reload=DENIED_401_403_ABSENT_AT_PROXY_OR_NETWORK',
              'GET_/-/support=DENIED_401_403_ABSENT_AT_PROXY_OR_NETWORK',
              'DIRECT_NATIVE_RELOAD_SUCCESS=NO', 'DIRECT_NATIVE_SUPPORT_SUCCESS=NO',
              'MTLS_LOKI_WRITE=PASS', 'UNEXPECTED_404=0',
              'SOURCE_RUNTIME_DRIFT=0', 'This document does not deploy Alloy',
          ]
          missing = [value for value in required if value not in text]
          assert not missing, f'missing production API contract controls: {missing}'
          forbidden = [
              'ADMIN_BYPASS_AUTHORIZED=YES',
              'SSH_CONFIGURATION_CHANGES_AUTHORIZED=YES',
              ':latest',
              'The native API surface is limited to readiness and metrics',
          ]
          present = [value for value in forbidden if value in text]
          assert not present, f'forbidden production contract claims: {present}'

          compose = Path('codestra/deploy/compose.candidate.yaml').read_text(encoding='utf-8')
          for required_source in (
              '--server.http.listen-addr=127.0.0.1:12345',
              'alloy-readonly-proxy:', 'network_mode: service:alloy',
              'ALLOY_HEALTHCHECK_URL: http://127.0.0.1:12346/-/ready',
          ):
              assert required_source in compose, f'missing route boundary: {required_source}'
          assert '--server.http.listen-addr=:12345' not in compose

          proxy = Path('codestra/deploy/readonly_proxy.go').read_text(encoding='utf-8')
          for required_source in (
              'request.Method != http.MethodGet', 'request.URL.RawQuery != ""',
              'http.StatusForbidden', 'maxResponseBytes', 'ReadHeaderTimeout',
          ):
              assert required_source in proxy, f'missing proxy control: {required_source}'

          image_test = Path('scripts/build_and_inspect_locked_image.sh').read_text(encoding='utf-8')
          for required_source in (
              'docker network create --internal', 'http://alloy-readonly:12345',
              'http://alloy-readonly:12346',
              'ALLOY_HEALTHCHECK_EXPECT_STATUS=403',
              'ALLOY_HEALTHCHECK_METHOD=POST', '/-/reload', '/-/support',
          ):
              assert required_source in image_test, f'missing exact-image denial proof: {required_source}'
          print('CODESTRA_ALLOY_PRODUCTION_API_CONTRACT=PASS')
          PY
