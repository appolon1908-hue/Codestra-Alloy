name: Validate Codestra Alloy intake monitoring

on:
  pull_request:
    paths:
      - "codestra/intake-monitoring.v1.json"
      - "codestra/config.alloy"
      - "scripts/validate_codestra_intake_monitoring.py"
      - ".github/workflows/validate-codestra-intake-monitoring.yml"
  push:
    branches:
      - development
      - test
      - staging
      - production
      - main
    paths:
      - "codestra/intake-monitoring.v1.json"
      - "codestra/config.alloy"
      - "scripts/validate_codestra_intake_monitoring.py"
      - ".github/workflows/validate-codestra-intake-monitoring.yml"

permissions:
  contents: read

concurrency:
  group: alloy-intake-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Compile and validate intake monitoring contract and agent enforcement
        env:
          PYTHONPYCACHEPREFIX: /tmp/codestra-alloy-intake-pycache
        run: |
          python -m py_compile scripts/validate_codestra_intake_monitoring.py
          python scripts/validate_codestra_intake_monitoring.py

      - name: Confirm source-only safety state
        run: |
          grep -q '"runtimeApplied": false' codestra/intake-monitoring.v1.json
          grep -q '"productionTargetsEnabled": false' codestra/intake-monitoring.v1.json
          grep -q '"liveBusinessWritesEnabledByThisContract": false' codestra/intake-monitoring.v1.json
          test "$(grep -c 'drop_counter_reason = \"intake_sensitive_payload\"' codestra/config.alloy)" -ge 2
