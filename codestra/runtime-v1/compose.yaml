name: codestra-alloy

services:
  docker-socket-proxy:
    image: ${DOCKER_SOCKET_PROXY_IMAGE:?use an immutable docker-socket-proxy image digest}
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      CONTAINERS: "1"
      INFO: "1"
      VERSION: "1"
      EVENTS: "1"
      NETWORKS: "0"
      SERVICES: "0"
      TASKS: "0"
      SECRETS: "0"
      AUTH: "0"
      POST: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    tmpfs:
      - /run:size=16m,mode=0755
      - /tmp:size=16m,mode=1777
    networks:
      - codestra_agent
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  alloy:
    image: ${ALLOY_IMAGE:?ALLOY_IMAGE must be an immutable image digest}
    restart: unless-stopped
    user: "0:0"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy
      - /etc/alloy/config.alloy
    environment:
      DOCKER_DISCOVERY_HOST: tcp://docker-socket-proxy:2375
      CODESTRA_BUSINESS: ${CODESTRA_BUSINESS:?use an approved portfolio business slug}
      CODESTRA_APPLICATION: ${CODESTRA_APPLICATION:?set application}
      CODESTRA_ENVIRONMENT: ${CODESTRA_ENVIRONMENT:?set environment}
      CODESTRA_SERVER: ${CODESTRA_SERVER:?set stable server name}
      CODESTRA_REGION: ${CODESTRA_REGION:?set region}
      CODESTRA_DEPLOYMENT: ${CODESTRA_DEPLOYMENT:?set immutable deployment identifier}
      LOKI_PUSH_URL: ${LOKI_PUSH_URL:?set private Loki push URL}
      LOKI_TENANT_ID: ${LOKI_TENANT_ID:?use platform or an approved business slug}
      PROMETHEUS_REMOTE_WRITE_URL: ${PROMETHEUS_REMOTE_WRITE_URL:?set private Prometheus remote-write URL}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:?set private Collector OTLP endpoint}
    depends_on:
      - docker-socket-proxy
    ports:
      - 127.0.0.1:4317:4317
      - 127.0.0.1:4318:4318
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - alloy_data:/var/lib/alloy
    secrets:
      - observability_ca.pem
      - alloy_client_cert.pem
      - alloy_client_key.pem
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks:
      - codestra_agent
      - codestra_observability
    stop_grace_period: 45s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.10"
          memory: 256M

secrets:
  observability_ca.pem:
    file: ${OBSERVABILITY_CA_FILE:?mount the Codestra observability CA}
  alloy_client_cert.pem:
    file: ${ALLOY_CLIENT_CERT_FILE:?mount an OpenBao-issued client certificate}
  alloy_client_key.pem:
    file: ${ALLOY_CLIENT_KEY_FILE:?mount the corresponding private key}

volumes:
  alloy_data:

networks:
  codestra_agent:
    internal: true
    name: codestra-agent
  codestra_observability:
    external: true
    name: codestra-observability
