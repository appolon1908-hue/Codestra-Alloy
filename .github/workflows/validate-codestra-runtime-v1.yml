name: Validate Codestra Alloy runtime v1

on:
  pull_request:
    paths:
      - "codestra/runtime-v1/**"
      - ".github/workflows/validate-codestra-runtime-v1.yml"
  push:
    branches:
      - development
      - test
      - staging
      - production
      - main
    paths:
      - "codestra/runtime-v1/**"
      - ".github/workflows/validate-codestra-runtime-v1.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: upstream/go.mod
          cache-dependency-path: upstream/go.sum
      - name: Check Alloy formatting with the vendored upstream source
        working-directory: upstream
        run: go run ./cmd/alloy fmt --test ../codestra/runtime-v1/config.alloy
      - name: Validate Alloy component graph with the vendored upstream source
        working-directory: upstream
        env:
          DOCKER_DISCOVERY_HOST: tcp://127.0.0.1:2375
          CODESTRA_BUSINESS: platform
          CODESTRA_APPLICATION: shared-platform
          CODESTRA_ENVIRONMENT: test
          CODESTRA_SERVER: ci-runner
          CODESTRA_REGION: ci
          CODESTRA_DEPLOYMENT: exact-head
          LOKI_PUSH_URL: https://loki.example.invalid/loki/api/v1/push
          LOKI_TENANT_ID: platform
          PROMETHEUS_REMOTE_WRITE_URL: https://prom.example.invalid/api/v1/write
          OTEL_EXPORTER_OTLP_ENDPOINT: otel.example.invalid:4317
        run: go run ./cmd/alloy validate ../codestra/runtime-v1/config.alloy
      - name: Validate Codestra security and exposure contract
        shell: python
        run: |
          from pathlib import Path
          import yaml

          root = Path("codestra/runtime-v1")
          alloy = (root / "config.alloy").read_text()
          compose_text = (root / "compose.yaml").read_text()
          compose = yaml.safe_load(compose_text)
          service = compose["services"]["alloy"]
          proxy = compose["services"]["docker-socket-proxy"]

          required_labels = {
              "codestra_business", "application", "service", "environment",
              "server", "region", "deployment",
          }
          assert all(label in alloy for label in required_labels)
          assert "stage.replace" in alloy and "[REDACTED]" in alloy
          assert "otelcol.receiver.otlp" in alloy
          assert "prometheus.remote_write" in alloy
          assert "loki.write" in alloy
          assert service["read_only"] is True
          assert "ALL" in service["cap_drop"]
          assert all(str(port).startswith("127.0.0.1:") for port in service["ports"])
          assert "/var/run/docker.sock" not in " ".join(service.get("volumes", []))
          assert proxy["environment"]["POST"] == "0"
          assert proxy["environment"]["SECRETS"] == "0"
          assert "latest" not in compose_text.lower()
          assert "password=" not in (alloy + compose_text).lower()
          print("Codestra Alloy runtime validation PASS")
      - name: Validate Compose structure without resolving runtime values
        run: docker compose -f codestra/runtime-v1/compose.yaml config --no-interpolate >/dev/null
